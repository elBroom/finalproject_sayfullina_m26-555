[project]
name = "valutatrade-hub"
version = "0.1.0"
description = "Платформа для отслеживания и симуляции торговли валютами"
readme = "README.md"
authors = [
    { name = "Zarina Sayfullina", email = "Zarina1458@yandex.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "prettytable>=3.18.0",
    "prompt>=0.4.1",
    "requests>=2.34.2",
]

[project.scripts]
valutatrade-hub = "valutatrade_hub.cli.interface:run_cli"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[tool.hatch.build.targets.wheel]
packages = ["valutatrade_hub"]

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]

[tool.valutatrade]
data_dir = "data"
rates_ttl_seconds = 300
default_base_currency = "USD"
log_level = "INFO"
log_path = "logs"
log_backup_count = 5
log_max_bytes = 5242880
